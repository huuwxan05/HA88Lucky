<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Xì Dách 3D — HA88Lucky TEST</title><link rel="stylesheet" href="/games/game-shell.css"></head><body><div class="wrap"><div class="top"><div><div class="brand">HA88Lucky V9 · Xì Dách 3D</div><div class="test">TEST / VIRTUAL BALANCE ONLY</div></div><a href="/" style="color:#cbd5e1">Trang chủ</a></div><div class="arena"><div class="table3d"><div class="orb">3D</div></div></div><div class="round" id="round">Đang mở vòng…</div><div class="controls"><div class="row" id="choices"><button data-code="PLAYER">PLAYER</button><button data-code="DEALER">DEALER</button></div><div class="row"><input id="amount" type="number" min="1" value="1000" step="100"><button class="primary" id="bet">ĐẶT CƯỢC TEST</button><button id="new">VÒNG MỚI</button><button id="settle">SETTLE TEST</button></div></div><div class="status" id="status">Đăng nhập để đặt cược TEST.</div></div><script src="/game-engine.js"></script><script>
const GAME="xi-dach-3d";let round=null,choice=null;const $=x=>document.getElementById(x);function msg(x){$('status').textContent=x}async function openRound(){try{const x=await HA88GameEngine.startRound(GAME);round=x.round;$('round').textContent='Round: '+round.round_id+' · đóng: '+round.closes_at+' · difficulty: '+x.game.difficulty;msg('Số dư TEST: '+((await HA88GameEngine.wallet()).balance||0).toLocaleString('vi-VN'))}catch(e){msg(e.message)}}document.querySelectorAll('#choices button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#choices button').forEach(x=>x.classList.remove('active'));b.classList.add('active');choice=b.dataset.code});$('bet').onclick=async()=>{if(!round||!choice)return msg('Chọn cửa và mở vòng trước.');try{const x=await HA88GameEngine.placeBet({game_code:GAME,round_id:round.round_id,bet_code:choice,amount:Number($('amount').value)});msg('Đã đặt TEST bet #'+x.bet_id+' · số dư '+Number(x.balance).toLocaleString('vi-VN'))}catch(e){msg(e.message)}};$('new').onclick=openRound;$('settle').onclick=async()=>{if(!round)return;try{const x=await HA88GameEngine.settleRound(GAME,round.round_id);msg('Kết quả TEST: '+x.round.result_code+' · vòng đã settlement.');}catch(e){msg(e.message)}};openRound();</script></body></html>
