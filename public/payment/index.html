<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nạp/Rút Demo — HA88Lucky</title><style>
body{margin:0;background:#070b14;color:#eef2ff;font:15px system-ui}main{max-width:980px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media(max-width:760px){.grid{grid-template-columns:1fr}}.card{background:#101827;border:1px solid #273449;border-radius:18px;padding:20px;box-shadow:0 15px 45px #0007}.gold{color:#fbbf24}input,button{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #334155;background:#0b1220;color:#fff}button{background:#d99a16;border:0;font-weight:800;cursor:pointer}.qr{max-width:280px;width:100%;background:#fff;padding:10px;border-radius:12px;display:block;margin:12px auto}.muted{color:#94a3b8}.status{padding:8px 10px;border-radius:8px;background:#172033;margin-top:10px}.demo{border:1px dashed #fbbf24;padding:10px;border-radius:10px;color:#fbbf24}
</style></head><body><main><h1>💳 Nạp / Rút <span class="gold">Demo</span></h1><p class="muted">Sandbox: không chuyển tiền thật và không cộng tiền thật.</p><div class="grid"><section class="card"><h2>➕ Nạp tiền</h2><input id="depositAmount" type="number" min="10000" placeholder="Số tiền demo (VNĐ)"><button id="deposit">Tạo đơn nạp</button><div id="depositBox"></div></section><section class="card"><h2>➖ Rút tiền</h2><input id="withdrawAmount" type="number" min="10000" placeholder="Số tiền demo (VNĐ)"><input id="bankCode" placeholder="Mã ngân hàng, ví dụ VCB"><input id="bankName" placeholder="Tên ngân hàng"><input id="accountName" placeholder="Tên chủ tài khoản"><input id="accountNumber" placeholder="Số tài khoản"><button id="withdraw">Tạo yêu cầu rút</button><div id="withdrawBox"></div></section></div><section class="card" style="margin-top:18px"><div class="demo">Chế độ DEMO — nút “Thanh toán thành công” chỉ mô phỏng trạng thái PAID.</div></section></main><script>
async function initPlayerCsrf(){const r=await fetch('/api/index.php?action=player_csrf',{credentials:'same-origin'});const x=await r.json();if(!r.ok)throw Error(x.error||'Chưa đăng nhập');sessionStorage.setItem('csrf',x.csrf)}
const csrf=()=>sessionStorage.getItem('csrf')||''; async function api(action,body={}){let r=await fetch('/api/index.php?action='+encodeURIComponent(action),{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf()},credentials:'same-origin',body:JSON.stringify(body)});let x=await r.json();if(!r.ok)throw Error(x.error||'request_failed');return x}
deposit.onclick=async()=>{try{let x=await api('payment_deposit_create',{amount:+depositAmount.value});depositBox.innerHTML=`<p>Đơn: <b>${x.order_code}</b></p><p>${x.account.bank_name}<br><b>${x.account.account_number}</b><br>${x.account.account_name}</p><img class="qr" src="${x.qr_url}" alt="VietQR demo"><p>Nội dung: <b>${x.transfer_content}</b></p><button onclick="demoPaid('${x.order_code}')">Mô phỏng thanh toán thành công</button>`}catch(e){depositBox.textContent=e.message}}
window.demoPaid=async o=>{try{let x=await api('payment_deposit_demo_paid',{order_code:o});depositBox.insertAdjacentHTML('beforeend',`<div class=status>Đã mô phỏng: ${x.status}</div>`)}catch(e){alert(e.message)}};
withdraw.onclick=async()=>{try{let x=await api('payment_withdraw_create',{amount:+withdrawAmount.value,bank_code:bankCode.value,bank_name:bankName.value,account_name:accountName.value,account_number:accountNumber.value});withdrawBox.innerHTML=`<div class=status>Đã tạo ${x.order_code} — ${x.status}</div>`}catch(e){withdrawBox.textContent=e.message}}
initPlayerCsrf().catch(e=>{document.body.insertAdjacentHTML('afterbegin','<div style="padding:12px;background:#3b0d0d;color:#fff;text-align:center">'+e.message+' — hãy đăng nhập trước.</div>')});
</script></body></html>
