<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản lý tài khoản nạp</title><style>body{margin:0;background:#080b12;color:#e5e7eb;font:14px system-ui}main{max-width:1100px;margin:auto;padding:24px}.card{background:#111827;border:1px solid #263244;border-radius:16px;padding:18px;margin-bottom:18px}input,select,button{padding:10px;margin:4px;border-radius:9px;border:1px solid #334155;background:#0b1220;color:#fff}button{background:#d99a16;color:#111;font-weight:800;cursor:pointer}.row{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}@media(max-width:700px){.row{grid-template-columns:1fr}}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #263244;text-align:left}.active{color:#4ade80;font-weight:800}.muted{color:#94a3b8}</style></head><body><main><h1>🏦 Tài khoản nhận tiền</h1><p class="muted">Chỉ super_admin. Tài khoản đang active sẽ được dùng cho đơn nạp mới.</p><section class="card"><h2 id="title">Thêm tài khoản</h2><div class="row"><input id="id" type="hidden"><input id="bankCode" placeholder="Mã ngân hàng / bank code"><input id="bankName" placeholder="Tên ngân hàng"><input id="accountName" placeholder="Tên tài khoản"><input id="accountNumber" placeholder="Số tài khoản"><input id="bin" placeholder="BIN 6 số (nếu dùng)"><input id="template" value="compact2" placeholder="QR template"><input id="prefix" value="HA88" placeholder="Tiền tố nội dung chuyển khoản"></div><label><input id="active" type="checkbox"> Kích hoạt ngay</label><br><button id="save">Lưu tài khoản</button><button id="reset">Nhập mới</button></section><section class="card"><h2>Danh sách</h2><table><thead><tr><th>Ngân hàng</th><th>Tài khoản</th><th>Trạng thái</th><th></th></tr></thead><tbody id="list"></tbody></table></section></main><script>
const csrf=()=>sessionStorage.getItem('admin_csrf')||'';async function api(a,b={},method='GET'){let r=await fetch('/api/index.php?action='+a,{method,headers:{'Content-Type':'application/json','X-CSRF-Token':csrf()},credentials:'same-origin',body:method==='GET'?undefined:JSON.stringify(b)});let x=await r.json();if(!r.ok)throw Error(x.error||'request_failed');return x}
async function load(){let x=await api('payment_account_list');list.innerHTML=x.accounts.map(a=>`<tr><td>${a.bank_name}<br><small>${a.bank_code}</small></td><td>${a.account_name}<br><b>${a.account_number}</b></td><td class="${a.active?'active':''}">${a.active?'ĐANG DÙNG':'Tắt'}</td><td><button onclick='edit(${JSON.stringify(a)})'>Sửa</button>${a.active?'':`<button onclick="activate(${a.id})">Dùng</button>`}</td></tr>`).join('')}
window.edit=a=>{id.value=a.id;bankCode.value=a.bank_code;bankName.value=a.bank_name;accountName.value=a.account_name;accountNumber.value=a.account_number;bin.value=a.bin||'';template.value=a.qr_template;prefix.value=a.transfer_prefix;active.checked=a.active;title.textContent='Sửa tài khoản'};
window.activate=async id=>{try{await api('payment_account_activate',{id},'POST');load()}catch(e){alert(e.message)}};save.onclick=async()=>{try{await api('payment_account_save',{id:+id.value||0,bank_code:bankCode.value,bank_name:bankName.value,account_name:accountName.value,account_number:accountNumber.value,bin:bin.value,qr_template:template.value,transfer_prefix:prefix.value,active:active.checked},'POST');alert('Đã lưu');load();reset.click()}catch(e){alert(e.message)}};reset.onclick=()=>{document.querySelectorAll('input').forEach(x=>{if(x.type!=='checkbox'&&x.type!=='hidden')x.value=''});id.value='';template.value='compact2';prefix.value='HA88';active.checked=false;title.textContent='Thêm tài khoản'};load().catch(e=>alert(e.message));
</script></body></html>
